name: Build AIC8800 RPM for Bazzite

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
    - name: Install Build Tools
      run: |
        dnf install -y git make gcc rpm-build rpmdevtools wget tar patch diffutils dnf-plugins-core binutils jq
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

    - name: Checkout Your Repo
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Prepare Sources
      run: |
        # --- 1. PREPARE FIRMWARE (From Radxa .deb Release) ---
        echo "Fetching latest firmware .deb url..."
        
        # Get the download URL for the latest 'aic8800-firmware' .deb
        FW_URL=$(curl -s https://api.github.com/repos/radxa-pkg/aic8800/releases/latest \
          | jq -r '.assets[] | select(.name | startswith("aic8800-firmware") and endswith(".deb")) | .browser_download_url' \
          | head -n 1)
        
        echo "Downloading: $FW_URL"
        wget -q -O firmware.deb "$FW_URL"
        
        # Extract the .deb (ar archive -> data.tar.xz -> files)
        ar x firmware.deb
        mkdir -p extracted_fw
        tar -xf data.tar.xz -C extracted_fw
        
        # Locate the actual firmware files inside the extracted structure
        # Usually found at ./lib/firmware/aic8800 or ./usr/lib/firmware/aic8800
        FW_SOURCE=$(find extracted_fw -type d -name "aic8800" | head -n 1)
        
        if [ -z "$FW_SOURCE" ]; then
           echo "ERROR: Could not find 'aic8800' folder inside the .deb!"
           find extracted_fw
           exit 1
        fi
        
        echo "Found firmware at: $FW_SOURCE"
        
        # Move to 'firmware' folder for our RPM packaging
        mkdir firmware
        cp -r "$FW_SOURCE"/* firmware/
        
        # Create Firmware Tarball
        tar -czf ~/rpmbuild/SOURCES/aic8800-firmware.tar.gz -C . firmware
        
        
        # --- 2. PREPARE DRIVER SOURCE (From Git) ---
        # We still need the git repo for the source code to compile the kernel module
        git clone https://github.com/radxa-pkg/aic8800.git driver-src
        
        # Apply Patches if they exist
        cd driver-src
        if [ -d "debian/patches" ]; then
          for patch in debian/patches/*.patch; do
            [ -e "$patch" ] || continue
            echo "Applying $patch"
            patch -p1 < "$patch" || echo "Warning: Patch failed"
          done
        fi
        rm -rf .git debian
        cd ..
        
        # Create Source Tarball
        tar -czf ~/rpmbuild/SOURCES/aic8800-source.tar.gz -C driver-src .

    - name: Build RPM
      run: |
        cp repo/aic8800.spec ~/rpmbuild/SPECS/
        rpmbuild -bb ~/rpmbuild/SPECS/aic8800.spec

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aic8800-rpms
        path: |
          /github/home/rpmbuild/RPMS/noarch/*.rpm
